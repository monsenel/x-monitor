version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xmonitor-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/xmonitor.db
      - SIDECAR_URL=http://scraper:8000
      - SIDECAR_SHARED_SECRET=${SIDECAR_SHARED_SECRET:-xmonitor-internal-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-admin123456}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-very-secret-random-32char-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN:-}
      - TWITTERAPI_IO_KEY=${TWITTERAPI_IO_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=${TZ:-Asia/Tehran}
      - NITTER_LOCAL_URL=http://nitter:8080
    volumes:
      - xmonitor-data:/data
      - nitter-sessions:/nitter-sessions
    networks:
      - xmonitor-net
    depends_on:
      - scraper

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: xmonitor-scraper
    restart: unless-stopped
    # Port is NOT exposed to the host for security - reachable ONLY internally from Node app
    expose:
      - "8000"
    environment:
      - SIDECAR_SHARED_SECRET=${SIDECAR_SHARED_SECRET:-xmonitor-internal-secret-change-me}
      - TWSCRAPE_DB_PATH=/data/twscrape_accounts.db
    volumes:
      - twscrape-data:/data
    networks:
      - xmonitor-net

  # Self-hosted Nitter. X accounts are added from the admin panel (Settings);
  # the panel writes the sessions file and this wrapper restarts Nitter on change.
  nitter:
    image: zedeus/nitter:latest
    container_name: xmonitor-nitter
    restart: unless-stopped
    # Not exposed to the host: reachable only from the app at http://nitter:8080
    expose:
      - "8080"
    environment:
      - NITTER_HMAC_KEY=${NITTER_HMAC_KEY:-xmonitor-nitter-hmac-change-me}
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    volumes:
      - ./nitter:/config:ro
      - nitter-sessions:/sessions:ro
    networks:
      - xmonitor-net
    depends_on:
      - nitter-redis
      # app first, so the shared sessions volume is created with the app's ownership
      - app

  nitter-redis:
    image: redis:7-alpine
    container_name: xmonitor-nitter-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - nitter-redis-data:/data
    networks:
      - xmonitor-net

volumes:
  xmonitor-data:
  nitter-sessions:
  nitter-redis-data:
  twscrape-data:

networks:
  xmonitor-net:
    driver: bridge
